[package]
name = "threadpet"
version = "1.0.0"
description = "AI-powered Desktop Anime Pet Companion"
authors = ["ThreadPet Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
